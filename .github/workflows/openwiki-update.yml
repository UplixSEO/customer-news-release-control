name: OpenWiki Update

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0
          persist-credentials: false
          ref: dev

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: |
          mkdir -p "${RUNNER_TEMP}/openwiki"
          git show "${OPENWIKI_WORKFLOW_SHA}:.github/openwiki/package.json" > "${RUNNER_TEMP}/openwiki/package.json"
          git show "${OPENWIKI_WORKFLOW_SHA}:.github/openwiki/package-lock.json" > "${RUNNER_TEMP}/openwiki/package-lock.json"
          npm ci --prefix "${RUNNER_TEMP}/openwiki"
        env:
          OPENWIKI_WORKFLOW_SHA: ${{ github.workflow_sha }}

      - name: Run OpenWiki
        run: '"${RUNNER_TEMP}/openwiki/node_modules/.bin/openwiki" code --update --print'
        env:
          OPENWIKI_PROVIDER: openrouter
          OPENWIKI_OPENROUTER_PROVIDER_ONLY: "DeepInfra"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_MODEL_ID: "deepseek/deepseek-v4-flash-0731"
          OPENWIKI_PAGE_CONCURRENCY: "3"
          # Required for the LangSmith connector's code-mode pull to authenticate.
          # For extra workspaces, add OPENWIKI_LANGSMITH_API_KEY_2, _3, ... as repo
          # secrets and env entries here.
          OPENWIKI_LANGSMITH_API_KEY: ${{ secrets.OPENWIKI_LANGSMITH_API_KEY }}
          # Optional: also trace this workflow's own OpenWiki run to LangSmith.
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: "true"

      - name: Drop CLAUDE.md recreated by OpenWiki
        # AGENTS.md is the only per-directory instruction file; if OpenWiki
        # recreated a CLAUDE.md file, drop it before the PR step picks it up.
        run: |
          git ls-files --others --modified --cached | grep -E '(^|/)CLAUDE\.md$' | grep -v '^\.agents/skills/' | xargs -r git rm -f --cached --ignore-unmatch
          find . -path ./.agents -prune -o -name CLAUDE.md -print -exec rm -f {} +

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: dev
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            openwiki
            AGENTS.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by an explicitly dispatched OpenWiki workflow.
