name: Instruction-file guard

# The repository carries no per-directory agent instruction file, so a tracked
# CLAUDE.md at any level — including .claude/CLAUDE.md — is a defect.
# Vendored `.agents/skills/**` third-party content is intentionally out of scope.
on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  no-claude-md:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # Was the mutable tag `@v4`, which resolves to v4.4.0 today. A moved tag
        # executes different code under the same workflow, with no diff here, so it
        # is pinned — to v4.3.1, the commit the rest of the organisation already
        # runs. One minor behind, taken deliberately for one shared fleet version.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Reject tracked CLAUDE.md
        shell: bash
        run: |
          ! git ls-files -z | grep -zEv '(^|/)\.agents/skills/' | grep -zE '(^|/)(\.claude/)?CLAUDE(\.local)?\.md$'
